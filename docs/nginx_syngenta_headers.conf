# Production Nginx Security, Caching & Range-Streaming Profile for Periscope 3D Widget
# Compatible with Nuxt 3 / 1C-Bitrix self-hosted deployment (152-FZ compliant, zero external CDN)

# 1. MIME types required for WebGPU/WebGL2, glTF 2.0, KTX2 GPU textures, HDR/PMREM & WASM decoders
types {
    model/gltf-binary                 glb;
    model/gltf+json                   gltf;
    image/ktx2                        ktx2;
    image/webp                        webp;
    image/vnd.radiance                hdr;
    application/wasm                  wasm;
}

# 2. Hardened Content-Security-Policy (NO 'unsafe-eval' and NO foreign CDN domains)
# - 'wasm-unsafe-eval' enables Meshopt / KTX2 BasisU WebAssembly decoders safely
# - blob: in img-src & connect-src allows GLTFLoader / ImageBitmapLoader embedded texture decoding
# - blob: in worker-src allows OffscreenCanvas / decoder Web Workers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self' https://www.syngenta.ru;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 3. Immutable edge caching + HTTP Byte-Range support for 3D models, WebP fallback sprites & vendor JS
location ~* ^/periscope/(assets|vendor)/.*\.(glb|ktx2|webp|hdr|wasm|js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Accept-Ranges "bytes" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip_static on;
    etag on;
}

# 4. Short-TTL revalidated JSON passports so CMS / pesticide dosage updates propagate within 5 minutes
location ~* ^/periscope/data/.*\.json$ {
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 5. Explicit block of raw authoring files (.blend, .blend1, source maps, python scripts)
location ~* \.(blend|blend1|py|pyc|map)$ {
    deny all;
    return 404;
}
